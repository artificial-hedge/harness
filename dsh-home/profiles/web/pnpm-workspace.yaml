packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
supportedArchitectures:
  os:
    - darwin
  cpu:
    - arm64
  libc:
    - current
minimumReleaseAgeExclude:
  - dsh-plugin-shop@0.8.0
  - '@a1exsun/dsh-council@0.1.0'
  - '@a9i5k4/dsh-auto-memory@2.2.1'
  - '@agent_forge/forge-dsh@1.53.0'
  - '@anweat/dsh-browser@0.1.11'
  - dsh-context@0.46.0
allowBuilds:
  '@jackwener/opencli': true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
